<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><title>Iniciar Sesión</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen px-4">
    <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Panel Administrativo</h2>
        {% with messages = get_flashed_messages() %}{% if messages %}
            <div class="bg-red-100 text-red-700 p-3 rounded-xl mb-4 text-sm">{{ messages[0] }}</div>
        {% endif %}{% endwith %}
        <form method="POST">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
                <input type="text" name="username" required class="w-full border border-gray-300 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                <input type="password" name="password" required class="w-full border border-gray-300 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl transition">Entrar</button>
        </form>
    </div>
</body>
</html>
