<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestro Catálogo</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <nav class="bg-white shadow-sm py-4 px-6 flex justify-between items-center max-w-6xl mx-auto rounded-b-xl">
        <h1 class="text-2xl font-bold text-indigo-600 tracking-wide">✨ MiCatálogo</h1>
        <a href="{{ url_for('login') }}" class="text-sm text-gray-500 hover:text-indigo-600 transition">Admin Panel</a>
    </nav>

    <main class="max-w-6xl mx-auto px-4 py-8">
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            {% for p in productos %}
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition duration-300 flex flex-col">
                <div class="relative pt-[100%] bg-gray-100">
                    <img src="{{ p.url_foto }}" alt="{{ p.nombre }}" class="absolute top-0 left-0 w-full h-full object-cover">
                </div>
                <div class="p-5 flex-1 flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start gap-2 mb-2">
                            <h2 class="text-xl font-bold text-gray-900 leading-tight">{{ p.nombre }}</h2>
                            <span class="text-lg font-extrabold text-indigo-600 whitespace-nowrap">${{ "{:,.2f}".format(p.precio) }}</span>
                        </div>
                        <p class="text-gray-600 text-sm line-clamp-3 mb-4">{{ p.descripcion }}</p>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-2 mt-auto">
                        <!-- Botón WhatsApp -->
                        <a href="https://whatsapp.com{{ ('¡Hola! Mira este producto: ' + p.nombre + ' por $' + p.precio|string + '. Puedes verlo aquí: ' + base_url)|urlencode }}" 
                           target="_blank" 
                           class="flex items-center justify-center gap-1 bg-green-500 hover:bg-green-600 text-white font-medium py-2.5 px-3 rounded-xl text-xs transition duration-200">
                           💬 Compartir
                        </a>
                        <!-- Botón Descargar en 1 clic -->
                        <button onclick="descargarImagen('{{ p.url_foto }}', '{{ p.nombre }}')" 
                                class="flex items-center justify-center gap-1 bg-gray-900 hover:bg-black text-white font-medium py-2.5 px-3 rounded-xl text-xs transition duration-200">
                           📥 Descargar
                        </button>
                    </div>
                </div>
            </div>
            {% else %}
            <div class="col-span-full text-center py-12 text-gray-500">No hay productos disponibles por el momento.</div>
            {% endfor %}
        </div>
    </main>

    <script>
        async function descargarImagen(url, nombreArchivo) {
            try {
                const respuesta = await fetch(url);
                const blob = await respuesta.blob();
                const blobUrl = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = nombreArchivo.replace(/\s+/g, '_') + '.jpg';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(blobUrl);
            } catch (error) {
                console.error("Error al descargar la imagen:", error);
                window.open(url, '_blank');
            }
        }
    </script>
</body>
                  </html>
