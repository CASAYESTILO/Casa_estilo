<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><title>Administración de Productos</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">
    <nav class="bg-white shadow-sm py-4 px-6 flex justify-between items-center max-w-6xl mx-auto rounded-b-xl">
        <span class="font-bold text-gray-900">Panel de Control</span>
        <a href="{{ url_for('logout') }}" class="text-sm text-red-500 hover:underline">Cerrar Sesión</a>
    </nav>

    <div class="max-w-6xl mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-3 gap-8">
        <!-- Formulario Crear -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 h-fit">
            <h3 class="text-lg font-bold mb-4 text-gray-900">Añadir Nuevo Producto</h3>
            <form method="POST" enctype="multipart/form-data" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Nombre</label>
                    <input type="text" name="nombre" required class="w-full border p-2.5 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Descripción</label>
                    <textarea name="descripcion" rows="3" required class="w-full border p-2.5 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Precio ($)</label>
                    <input type="number" step="0.01" name="precio" required class="w-full border p-2.5 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Imagen del Producto</label>
                    <input type="file" name="foto" accept="image/*" required class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-xl text-sm transition">Guardar Producto</button>
            </form>
        </div>

        <!-- Lista CRUD -->
        <div class="md:col-span-2 space-y-4">
            <h3 class="text-lg font-bold text-gray-900">Productos Registrados</h3>
            <div class="bg-white rounded-2xl shadow-sm border overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 border-b border-gray-100 text-xs font-semibold text-gray-500 uppercase">
                            <th class="p-4">Info</th>
                            <th class="p-4">Precio</th>
                            <th class="p-4 text-right">Acciones</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100 text-sm">
                        {% for p in productos %}
                        <tr>
                            <td class="p-4 flex items-center gap-3">
                                <img src="{{ p.url_foto }}" class="w-12 h-12 rounded-lg object-cover">
                                <div>
                                    <div class="font-bold text-gray-900">{{ p.nombre }}</div>
                                    <div class="text-xs text-gray-500 line-clamp-1">{{ p.descripcion }}</div>
                                </div>
                            </td>
                            <td class="p-4 font-semibold">${{ p.precio }}</td>
                            <td class="p-4 text-right">
                                <form action="{{ url_for('eliminar_producto', id=p.id) }}" method="POST" onsubmit="return confirm('¿Eliminar producto?')" class="inline">
                                    <button type="submit" class="text-red-500 hover:text-red-700 font-medium text-xs">Eliminar</button>
                                </form>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
          </html>
